name: Deploy TerrierBot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          set -e
          cd /home/ubuntu/TerrierBot
          if [ ! -d .git ]; then
            echo "Repository directory not initialized; exiting."
            exit 1
          fi
          git fetch --prune origin
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /home/ubuntu/TerrierBot
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Restart PM2 Process
        run: |
          cd /home/ubuntu/TerrierBot
          export PATH=$PATH:/home/ubuntu/.npm-global/bin
          pm2 restart terrierbot --update-env || npx pm2 restart terrierbot